
<!DOCTYPE html>
<html>
<head>
    <title>Online Examination & Proctoring Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Examination & Proctoring Platform</h1>

    <div class="top-section">

        <div>
            <h2>Online Exam</h2>
            <p><b>Time Remaining:</b> <span id="timer">02:00</span></p>
        </div>

        <div>
            <video id="video" autoplay muted></video>
            <p>Webcam Proctoring</p>
        </div>

    </div>

    <hr>

    <div id="quiz">

        <h2 id="question"></h2>

        <div id="options"></div>

        <button onclick="nextQuestion()">Next</button>

    </div>

    <div id="result" class="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
